<header class="fixed w-full top-0 z-50 bg-dark/80 backdrop-blur-md border-b border-white/5 transition-all duration-300">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
        <!-- Logo -->
        <a href="{{ site.Home.RelPermalink }}" class="text-2xl font-bold text-white flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">R</div>
            Rishav M.
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-8">
            {{ range site.Menus.main }}
            <a href="{{ .URL }}" class="text-gray-300 hover:text-white font-medium text-sm transition-colors">{{ .Name
                }}</a>
            {{ end }}
            <!-- Example Static Links if menu is empty -->
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm transition-colors">Pricing</a>
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm transition-colors">About</a>
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm transition-colors">Blog</a>
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm transition-colors">Contact</a>
        </nav>

        <!-- Right Side Actions -->
        <div class="hidden md:flex items-center gap-4">
            <a href="#" class="text-gray-300 hover:text-white font-medium text-sm">Sign In</a>
            <a href="#"
                class="bg-white text-black px-4 py-2 rounded-md font-bold text-sm hover:bg-gray-200 transition-colors">Get
                Started</a>
        </div>

        <!-- Mobile Menu Button -->
        <button id="mobile-menu-btn" class="md:hidden text-white p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu"
        class="fixed inset-0 bg-dark z-40 transform translate-x-full transition-transform duration-300 md:hidden flex flex-col pt-24 px-6">
        <a href="#" class="text-xl font-medium text-white border-b border-gray-800 py-4">Home</a>
        <a href="#" class="text-xl font-medium text-white border-b border-gray-800 py-4">Pricing</a>
        <a href="#" class="text-xl font-medium text-white border-b border-gray-800 py-4">About</a>
        <a href="#" class="text-xl font-medium text-white border-b border-gray-800 py-4">Blog</a>
        <a href="#" class="text-xl font-medium text-white border-b border-gray-800 py-4">Contact</a>
        <div class="mt-8 flex flex-col gap-4">
            <a href="#" class="btn-secondary text-center">Sign In</a>
            <a href="#" class="btn-primary text-center">Get Started</a>
        </div>
    </div>
</header>

<script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    let isMenuOpen = false;

    menuBtn.addEventListener('click', () => {
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            mobileMenu.classList.remove('translate-x-full');
            // Change icon to close
            menuBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
        } else {
            mobileMenu.classList.add('translate-x-full');
            // Change icon to hamburger
            menuBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>';
        }
    });
</script>
